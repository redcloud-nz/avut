name: Manage Release Version

# Runs on every push to `production`. Reads the version and versionName from
# package.json, creates a `v{version}` git tag, and publishes a GitHub Release
# for it — body is `docs/releases/v{version}.md` with a categorized PR list
# appended, generated by `.github/scripts/generate-release-notes.sh` (NOT
# GitHub's built-in `generate_release_notes`, which only picks up PRs based on
# `production` — useless here since feature work merges into `integration`).
# Finally, merges `production` back into `integration` so the version bump
# (and anything else that landed only on `production`, e.g. a hotfix) isn't
# lost from `integration`'s history.

on:
  push:
    branches:
      - production
    paths-ignore:
      - ".github/workflows/**"

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_name: ${{ steps.get_version.outputs.version_name }}
      tag_created: ${{ steps.check_tag.outputs.exists != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -e "console.log(require('./package.json')['nz.avut'].version)")
          VERSION_NAME=$(node -e "console.log(require('./package.json')['nz.avut'].versionName)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "notes_file=docs/releases/v${VERSION}.md" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require release notes
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          NOTES="${{ steps.get_version.outputs.notes_file }}"
          if [ ! -s "$NOTES" ]; then
            echo "::error::Missing release notes: ${NOTES}. Add it in the release PR (see docs/releasing.md)."
            exit 1
          fi

      # Must run before the tag is created below, so `git describe` finds the
      # *previous* release rather than the one we're about to publish.
      - name: Find previous release tag
        id: prev_tag
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release ${{ steps.get_version.outputs.version }} (${{ steps.get_version.outputs.version_name }})"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - name: Build release notes
        id: notes
        if: steps.check_tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat "${{ steps.get_version.outputs.notes_file }}" > /tmp/release-body.md
          echo >> /tmp/release-body.md
          .github/scripts/generate-release-notes.sh "${{ steps.prev_tag.outputs.tag }}" "${{ github.sha }}" >> /tmp/release-body.md
          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }} - ${{ steps.get_version.outputs.version_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-integration:
    name: Sync production back into integration
    needs: create-release
    if: needs.create-release.outputs.tag_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # `production` only ever moves forward via an admin-merged release (or
      # hotfix) PR, so this merge is expected to be conflict-free in the
      # common case. If it isn't, fail loudly rather than force anything —
      # docs/releasing.md covers resolving it by hand via a normal PR.
      - name: Merge production into integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          if ! git merge origin/production --no-edit -m "chore(release): sync v${{ needs.create-release.outputs.version }} back from production"; then
            echo "::error::production→integration sync merge conflicted. Resolve by hand: git switch integration && git merge origin/production, then push (see docs/releasing.md)."
            exit 1
          fi
          git push origin integration
