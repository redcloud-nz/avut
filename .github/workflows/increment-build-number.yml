name: Increment Build Number

# Increments `nz.avut.build` in package.json on every push to master so each
# merge gets a unique, monotonically increasing build number
# (displayed as `{version}-build.{build}`, see next.config.ts).

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/workflows/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: increment-build-number
  cancel-in-progress: false

jobs:
  increment-build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Increment build number
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg['nz.avut'].build += 1;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('New build number:', pkg['nz.avut'].build);
          "

      - name: Commit, push branch and merge via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `master` is protected by a repository rule that requires changes
          # to land through a pull request, so pushing the commit straight to
          # `master` is rejected (GH013). Push it to a side branch instead and
          # merge that in via a pull request.
          BRANCH="chore/increment-build-number-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: increment build number [skip ci]"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base master --head "$BRANCH" \
            --title "chore: increment build number" \
            --body "Automated build number increment.")
          gh pr merge "$PR_URL" --squash --delete-branch --auto
