name: Bug Report
description: Report something that isn't working as expected
labels: ["bug"]
type: "Bug"
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: org
    attributes:
      label: Organization / module
      description: Which org and module was this in (e.g. skill-track, i3, admin)?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, browser/OS, error messages, links, etc.
    validations:
      required: false
